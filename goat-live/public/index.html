<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/js/lite.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE GOAT Badminton Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root { --blue: #022dc6; --gold: #fcc500; --ink: #060b26; --red: #ff2d46; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; color: #fff; font-family: 'Barlow Condensed', sans-serif; background:
    radial-gradient(900px 600px at 10% -10%, rgba(80,130,255,0.45), transparent 70%),
    radial-gradient(700px 500px at 100% 110%, rgba(252,197,0,0.18), transparent 70%),
    linear-gradient(160deg, #1550ff 0%, var(--blue) 45%, #011a86 100%); display: flex; flex-direction: column; }
  body::before { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,0.035) 0 60px, rgba(255,255,255,0) 60px 140px); }
  header { text-align: center; padding: clamp(36px, 7vh, 80px) 16px clamp(20px, 4vh, 40px); position: relative; }
  .kicker { display: inline-flex; align-items: center; gap: 16px; color: var(--gold); font-weight: 700; letter-spacing: 0.35em; text-transform: uppercase;
    font-size: clamp(14px, 2vw, 24px); }
  .kicker::before, .kicker::after { content: ''; width: clamp(30px, 6vw, 90px); height: 2px; }
  .kicker::before { background: linear-gradient(90deg, transparent, var(--gold)); }
  .kicker::after { background: linear-gradient(90deg, var(--gold), transparent); }
  h1 { font-family: 'Anton', sans-serif; font-weight: 400; font-size: clamp(54px, 11vw, 150px); line-height: 0.95; margin: 10px 0 0; letter-spacing: 0.06em;
    text-shadow: 5px 6px 0 var(--ink); }
  .cards { position: relative; flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 560px)); justify-content: center; gap: clamp(16px, 3vw, 36px);
    padding: 0 16px clamp(30px, 6vh, 70px); align-items: start; }
  .card { position: relative; display: block; color: inherit; text-decoration: none; border-radius: 24px; overflow: hidden; min-height: 360px;
    background: rgba(6,11,38,0.55); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 30px 70px rgba(1,10,58,0.45);
    transition: transform 0.35s cubic-bezier(.2,1,.3,1), box-shadow 0.35s, border-color 0.35s; isolation: isolate; }
  .card:hover { transform: translateY(-6px); border-color: rgba(252,197,0,0.6); box-shadow: 0 40px 90px rgba(1,10,58,0.6), 0 0 0 1px rgba(252,197,0,0.4); }
  .card:active { transform: translateY(-2px) scale(0.99); }
  .card:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
  .card .inner { position: relative; z-index: 1; padding: 28px; height: 100%; display: flex; flex-direction: column; min-height: 360px; }
  .tag { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; font-weight: 700; letter-spacing: 0.2em; font-size: 15px; text-transform: uppercase;
    padding: 6px 12px; border-radius: 8px; background: var(--gold); color: var(--ink); }
  .tag.live { background: var(--red); color: #fff; }
  .tag.live::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .card h2 { font-family: 'Anton', sans-serif; font-weight: 400; font-size: clamp(44px, 6vw, 72px); letter-spacing: 0.06em; margin: 16px 0 6px; line-height: 1; }
  .card p { margin: 0; color: rgba(255,255,255,0.75); font-size: 20px; letter-spacing: 0.04em; }
  .mini { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 8px; }
  .mini li { display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: center; gap: 12px; background: rgba(6,11,38,0.7); border-radius: 10px; padding: 8px 12px;
    font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; }
  .mini li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini .t { background: var(--gold); color: var(--ink); border-radius: 6px; text-align: center; padding: 2px 0; font-size: 18px; }
  .mini .t.l { background: var(--red); color: #fff; }
  .mini i { color: var(--gold); font-style: normal; font-family: 'Anton', sans-serif; margin: 0 6px; }
  .go { margin-top: auto; padding-top: 20px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
  .go::after { content: '→'; transition: transform 0.3s; }
  .card:hover .go::after { transform: translateX(6px); }
  .ads .bg { position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center; transform: scale(1.04); transition: transform 6s ease-out, opacity 0.8s; }
  .ads:hover .bg { transform: scale(1.12); }
  .ads::after { content: ''; position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, rgba(6,11,38,0.6), rgba(6,11,38,0.92)); }
  .play { position: relative; width: 84px; height: 84px; border-radius: 50%; background: rgba(252,197,0,0.95); display: grid; place-items: center; margin: auto 0 0; }
  .play::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 50%; border: 3px solid rgba(252,197,0,0.7); animation: ring 2.4s cubic-bezier(0,0,.2,1) infinite; }
  .play::before { content: ''; margin-left: 6px; border-left: 26px solid var(--ink); border-top: 16px solid transparent; border-bottom: 16px solid transparent; }
  @keyframes ring { 0% { transform: scale(1); opacity: 0.8; } 70%, 100% { transform: scale(1.5); opacity: 0; } }
  .player { position: fixed; inset: 0; z-index: 100; background: #000; }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  footer { position: relative; text-align: center; padding: 0 16px 24px; color: rgba(255,255,255,0.45); font-size: 15px; letter-spacing: 0.15em; text-transform: uppercase; }
  @media (max-width: 820px) { .cards { grid-template-columns: minmax(0, 560px); } }
  @media (max-width: 520px) {
    .kicker { letter-spacing: 0.18em; gap: 10px; font-size: 13px; }
    .kicker::before, .kicker::after { width: 22px; }
    .card .inner { padding: 22px; min-height: 0; }
    .card { min-height: 0; }
    .ads .inner { min-height: 300px; }
    .mini li { font-size: 18px; grid-template-columns: 64px minmax(0, 1fr); }
    .mini li span:last-child { white-space: normal; overflow: visible; line-height: 1.15; }
  }
  /* smart TVs / slow devices: cheap to paint — solid colours, no texture overlay, no shadows, no motion */
  html.lite body { background: #022dc6; }
  html.lite body::before { display: none; }
  html.lite .card { background: #0a1550; border-color: rgba(255,255,255,0.18); isolation: auto; }
  html.lite .card:hover, html.lite .card:focus { border-color: #fcc500; }
  html.lite .ads::after { background: rgba(6,11,38,0.8); }
  html.lite .mini li { background: #060b26; }
  html.lite .play::after, html.lite .tag.live::before { animation: none; }
  html.lite .card, html.lite .card:hover { box-shadow: none; transform: none; transition: border-color 0.2s; }
  html.lite .ads .bg, html.lite .ads:hover .bg { transform: none; transition: none; }
  html.lite h1, html.lite .kicker { text-shadow: none; }
  @media (prefers-reduced-motion: reduce) { .play::after, .tag.live::before { animation: none; } .card, .ads .bg { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="kicker" id="title">THE GOAT Badminton Tournament</div>
  <h1>MATCH DAY</h1>
</header>
<main class="cards">
  <a class="card fixtures" href="/fixtures">
    <div class="inner">
      <span class="tag" id="fxTag">Fixtures</span>
      <h2>FIXTURES</h2>
      <p id="fxSub">Live order of play — updates in real time</p>
      <ul class="mini" id="fxList"></ul>
      <span class="go">Open live board</span>
    </div>
  </a>
  <a class="card ads" href="/ads">
    <div class="bg" id="adBg"></div>
    <div class="inner">
      <span class="tag">Showcase</span>
      <h2>SLIDESHOW</h2>
      <p id="adSub">Our partners &amp; sponsors</p>
      <span class="play" aria-hidden="true"></span>
      <span class="go">Play slideshow</span>
    </div>
  </a>
</main>
<footer>Updates live · no refresh needed</footer>
<script src="/config.js"></script>
<script src="/js/goat-shared.js"></script>
<script src="/js/live.js"></script>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let lastHtml = '';
  GoatLive.connect((s) => {
    document.getElementById('title').textContent = s.title;
    document.title = s.title;
    const live = s.matches.filter((m) => m.status === 'live');
    const tag = document.getElementById('fxTag');
    tag.className = 'tag' + (live.length ? ' live' : '');
    tag.textContent = live.length ? `${live.length} live now` : 'Fixtures';
    const show = s.matches.slice(0, 4);
    const html = show.map((m) =>
      `<li><span class="t ${m.status === 'live' ? 'l' : ''}">${m.status === 'live' ? 'LIVE' : m.status === 'called' ? 'CT ' + esc(m.court) : '~' + GoatLive.fmtTime(m.time)}</span><span>${esc(m.a)}<i>V</i>${esc(m.b)}</span></li>`).join('');
    if (html !== lastHtml) { lastHtml = html; document.getElementById('fxList').innerHTML = html; }
    document.getElementById('fxSub').textContent = s.matches.length ? `${s.matches.length} matches still to play` : 'Fixtures coming up shortly';
  });
  // Slideshow opens in place, fullscreen, from this click — the click is what lets the browser play the video WITH sound.
  let player = null;
  function closePlayer() {
    if (!player) return;
    player.remove(); player = null;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }
  document.querySelector('.card.ads').addEventListener('click', (e) => {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return; // let "open in new tab" work normally
    e.preventDefault();
    player = document.createElement('div');
    player.className = 'player';
    player.innerHTML = '<iframe src="/ads" allow="autoplay; fullscreen" title="Slideshow"></iframe>';
    document.body.append(player);
    player.requestFullscreen?.().catch(() => {});
    player.querySelector('iframe').focus();
  });
  addEventListener('message', (e) => { if (e.origin === location.origin && e.data === 'goat-close-ads') closePlayer(); });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) closePlayer(); });
  fetch('/api/ads').then((r) => r.json()).then((ads) => {
    const img = ads.find((a) => !a.video);
    if (img) document.getElementById('adBg').style.backgroundImage = `url("${img.src}")`;
    document.getElementById('adSub').textContent = ads.length ? `${ads.length} slides · partners & sponsors` : 'Add images to public/ads';
  }).catch(() => {});
</script>
</body>
</html>

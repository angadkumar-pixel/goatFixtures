<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a1c">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Control Room · THE GOAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header class="top">
  <span class="logo">G</span><b class="name">Control Room</b><span class="conn" id="conn" title="Connection"></span>
  <nav class="actions">
    <button id="undoBtn" type="button">↶ Undo</button>
    <a class="btn" href="/fixtures" target="_blank" rel="noopener">Board ↗</a>
    <button id="logoutBtn" type="button" class="ghost" aria-label="Log out">⎋</button>
  </nav>
</header>


<main class="cols">
  <section class="col">
    <h2>On the board <span id="boardCount"></span></h2>
    <ol class="list" id="boardList" data-zone="board"></ol>
  </section>
  <section class="col">
    <h2>Next in queue <span id="queueCount"></span></h2>
    <ol class="list" id="queueList" data-zone="queue"></ol>
    <form class="addrow" id="addForm" autocomplete="off">
      <input name="a" placeholder="Player A" maxlength="60" required>
      <input name="b" placeholder="Player B" maxlength="60" required>
      <button class="primary" type="submit" aria-label="Add match">+ Add</button>
    </form>
    <details class="done"><summary>Completed <span id="doneCount">0</span></summary><ol id="doneList"></ol></details>
  </section>
</main>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <div><h3 id="sheetTitle"></h3><p id="sheetSub"></p></div>
    <button type="button" class="ghost x" data-close aria-label="Close">✕</button>
  </div>
  <div id="sheetActs" class="sheet-acts"></div>
  <form id="editForm" class="sheet-edit" autocomplete="off">
    <div class="two"><label>Player A<input name="a" maxlength="60" required></label><label>Player B<input name="b" maxlength="60" required></label></div>
    <div class="sheet-foot"><button type="button" class="danger" id="delBtn">Delete match</button><button type="submit" class="primary">Save changes</button></div>
  </form>
</dialog>

<div id="toasts" aria-live="polite"></div>
<script src="/js/live.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>

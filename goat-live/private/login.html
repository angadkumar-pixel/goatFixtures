<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin login · THE GOAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; font: 15px Inter, system-ui, sans-serif; color: #eef1ff;
    background: radial-gradient(800px 500px at 50% -10%, rgba(31,77,255,0.35), transparent 70%), #060a1c; }
  form { width: min(380px, 100%); background: #0d1433; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 30px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
  .logo { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(160deg, #1550ff, #022dc6);
    font: 36px Anton, sans-serif; color: #fcc500; margin-bottom: 18px; box-shadow: inset 0 0 0 1px rgba(252,197,0,0.5); }
  h1 { font: 30px Anton, sans-serif; letter-spacing: 0.06em; margin: 0 0 4px; }
  p { margin: 0 0 22px; color: #8f99c7; }
  input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16); background: #070c24; color: inherit; font: inherit; outline: none; }
  input:focus { border-color: #fcc500; box-shadow: 0 0 0 3px rgba(252,197,0,0.2); }
  button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 10px; background: #fcc500; color: #0a0f2c; font: 700 15px Inter, sans-serif; cursor: pointer; }
  button:disabled { opacity: 0.6; }
  .err { color: #ff8a98; min-height: 20px; margin-top: 10px; font-size: 13px; }
  .shake { animation: sh 0.4s; }
  @keyframes sh { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
</style>
</head>
<body>
<form id="f">
  <div class="logo">G</div>
  <h1>CONTROL ROOM</h1>
  <p>Admin access only.</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button type="submit">Log in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector('button');
    btn.disabled = true;
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: f.password.value }) });
    if (r.ok) return location.reload();
    const j = await r.json().catch(() => ({}));
    document.getElementById('err').textContent = j.error || 'Login failed';
    f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    btn.disabled = false; f.password.select();
  });
</script>
</body>
</html>
